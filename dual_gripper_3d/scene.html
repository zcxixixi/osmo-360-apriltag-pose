    if(validationEvent?.observations?.left&&validationEvent?.observations?.right){const lp=new THREE.Vector3(...validationEvent.observations.left.position_m),rp=new THREE.Vector3(...validationEvent.observations.right.position_m),mid=lp.clone().add(rp).multiplyScalar(.5);const leftEventPoint=new THREE.Mesh(new THREE.SphereGeometry(.014,24,12),new THREE.MeshBasicMaterial({color:0x37c8ff,depthTest:false})),rightEventPoint=new THREE.Mesh(new THREE.SphereGeometry(.010,24,12),new THREE.MeshBasicMaterial({color:0x58df91,depthTest:false}));leftEventPoint.position.copy(lp);rightEventPoint.position.copy(rp);leftEventPoint.renderOrder=90;rightEventPoint.renderOrder=91;scene.add(leftEventPoint,rightEventPoint);const eventLink=new THREE.Line(new THREE.BufferGeometry().setFromPoints([lp,rp]),new THREE.LineBasicMaterial({color:0xff5ca8,depthTest:false}));eventLink.renderOrder=89;scene.add(eventLink);const ring=new THREE.Mesh(new THREE.TorusGeometry(.038,.004,12,48),new THREE.MeshBasicMaterial({color:0xff5ca8,depthTest:false}));ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),worldUp);ring.position.copy(mid);ring.renderOrder=92;scene.add(ring);const gapMm=Number(validationEvent.distance_m)*1000,eventLabel=roleLabel(`${validationEvent.label} · ${gapMm.toFixed(1)} mm`,'#ff5ca8');eventLabel.position.copy(mid).addScaledVector(worldUp,.075);eventLabel.scale.set(.23,.05,1);document.getElementById('event-audit').textContent=`同一物理 A 点：右爪放下 → 左爪取走 · 当前两次观测距离 ${gapMm.toFixed(1)} mm`;document.getElementById('event-audit').style.display=interactive?'block':'none'}
    // Timeline positions are TCP positions, while the STL root is base_link.
    // T_base_tcp is fixed by CAD, so place the mesh at
    // p_world_base = p_world_tcp - R_world_base * p_base_tcp.
    const tcpInBase=new THREE.Vector3(.1356,0,.0101);
    function apply(root,data){const visible=data.visible!==false;root.visible=visible;root.userData.tcpMarker.visible=visible;root.userData.tipArrow.visible=visible;root.quaternion.fromArray(data.q);root.userData.tcpWorld.fromArray(data.p);if(tagReference)root.position.copy(root.userData.tcpWorld);else root.position.copy(root.userData.tcpWorld).sub(tcpInBase.clone().applyQuaternion(root.quaternion));root.userData.tcpMarker.position.copy(root.userData.tcpWorld);root.userData.tipArrow.position.copy(root.userData.tcpWorld);root.userData.tipArrow.setDirection(new THREE.Vector3(1,0,0).applyQuaternion(root.quaternion).normalize());root.userData.j1.rotation.z=THREE.MathUtils.degToRad(data.joints[0]);root.userData.j2.rotation.z=THREE.MathUtils.degToRad(data.joints[1])}
    const scrubber=document.getElementById('scrubber'),playButton=document.getElementById('play');let currentFrame=0,playing=true,lastTick=performance.now();scrubber.max=String(timeline.frames.length-1);
    const renderScene=()=>{if(overviewRenderer){camera.position.copy(operatorEyePosition);camera.lookAt(operatorLookTarget);const showTags=timeline.render_mode==='single_gripper_world_diagnostic';if(!showTags)tagObjects.forEach(item=>item.visible=false);renderer.render(scene,camera);if(!showTags)tagObjects.forEach(item=>item.visible=true);overviewRenderer.render(scene,overviewCamera)}else renderer.render(scene,camera)};
    window.renderFrame=index=>{currentFrame=Math.max(0,Math.min(Math.round(index),timeline.frames.length-1));const frame=timeline.frames[currentFrame];apply(left,frame.left);apply(right,frame.right);leftRoleLabel.visible=frame.left.visible!==false;rightRoleLabel.visible=frame.right.visible!==false;leftLine.visible=frame.left.visible!==false;rightLine.visible=frame.right.visible!==false;leftRoleLabel.position.copy(left.userData.tcpWorld).addScaledVector(worldUp,.10);rightRoleLabel.position.copy(right.userData.tcpWorld).addScaledVector(worldUp,.10);const lineStart=auditMode?frame.episode_start:0;leftLine.geometry.setDrawRange(lineStart,currentFrame-lineStart+1);rightLine.geometry.setDrawRange(lineStart,currentFrame-lineStart+1);leftStart.position.fromArray(timeline.frames[lineStart].left.p);rightStart.position.fromArray(timeline.frames[lineStart].right.p);connector.visible=!auditMode&&frame.left.visible!==false&&frame.right.visible!==false;connectorGeometry.setFromPoints([left.userData.tcpWorld,right.userData.tcpWorld]);const separation=left.userData.tcpWorld.distanceTo(right.userData.tcpWorld)*1000,visiblePoint=frame.left.visible!==false?left.userData.tcpWorld:right.userData.tcpWorld,wallDistanceText=panelPlanes.left&&panelPlanes.right?`L ${Math.abs(visiblePoint.clone().sub(panelPlanes.left.center).dot(panelPlanes.left.normal)*1000).toFixed(0)} / R ${Math.abs(visiblePoint.clone().sub(panelPlanes.right.center).dot(panelPlanes.right.normal)*1000).toFixed(0)} mm`:'';document.getElementById('left-angle').textContent=frame.left.opening.toFixed(1)+'°';document.getElementById('right-angle').textContent=frame.right.opening.toFixed(1)+'°';document.getElementById('left-state').textContent=auditMode?`VALID · xyz ${frame.left.source_p.map(v=>v.toFixed(3)).join(', ')}`:frame.left.pose_state+' · angle '+frame.left.angle_state;document.getElementById('right-state').textContent=auditMode?`VALID · xyz ${frame.right.source_p.map(v=>v.toFixed(3)).join(', ')}`:frame.right.pose_state+' · angle '+frame.right.angle_state;document.getElementById('separation').textContent=auditMode?`${frame.source_index+1} / ${timeline.source_frames}`:timeline.render_mode==='single_gripper_world_diagnostic'?wallDistanceText:separation.toFixed(1)+' mm';if(auditMode)document.getElementById('pose-filter').textContent=`EPISODE ${frame.episode+1}/${timeline.training_episodes} · exact Zarr values`;document.getElementById('time').textContent=frame.t.toFixed(2)+' / '+timeline.duration_s.toFixed(2)+' s';scrubber.value=String(currentFrame);renderScene();return true};
    if(interactive){document.querySelectorAll('.pip-label,.pip-slot').forEach(item=>item.style.display='none');document.getElementById('player').style.display='grid';document.getElementById('interactive-help').style.display='block';document.getElementById('view-tools').style.display='flex';if(validationEvent){for(const [side,label] of [['right','跳到：右爪放下 A'],['left','跳到：左爪取走 A']]){const observation=validationEvent.observations?.[side];if(!observation)continue;const button=document.createElement('button');button.textContent=label;button.style.borderColor='#ff5ca8';button.onclick=()=>{playing=false;playButton.textContent='播放';window.renderFrame(observation.frame_index)};document.getElementById('view-tools').appendChild(button)}}const buttons=[...document.querySelectorAll('.view-tools button')];const activate=button=>{buttons.forEach(item=>item.classList.remove('active'));button.classList.add('active')};const choose=(button,points,showTags)=>{activate(button);tagObjects.forEach(item=>item.visible=showTags);fitView(points)};const chooseOperator=button=>{activate(button);tagObjects.forEach(item=>item.visible=true);camera.position.copy(operatorEyePosition);camera.lookAt(operatorLookTarget);orbit.target.copy(operatorLookTarget);orbit.update()};document.getElementById('view-operator').onclick=event=>chooseOperator(event.currentTarget);document.getElementById('view-grippers').onclick=event=>choose(event.currentTarget,motionPoints,false);document.getElementById('view-all').onclick=event=>choose(event.currentTarget,all,true);document.getElementById('view-tags').onclick=event=>choose(event.currentTarget,tagFramingPoints,true);if(timeline.default_view==='operator')chooseOperator(document.getElementById('view-operator'));else choose(document.getElementById('view-all'),all,true);playButton.onclick=()=>{playing=!playing;playButton.textContent=playing?'暂停':'播放';lastTick=performance.now()};scrubber.oninput=()=>{playing=false;playButton.textContent='播放';window.renderFrame(Number(scrubber.value))};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});renderer.setAnimationLoop(now=>{orbit.update();if(playing){const advance=(now-lastTick)*timeline.fps/1000;if(advance>=1){currentFrame=(currentFrame+Math.floor(advance))%timeline.frames.length;lastTick=now;window.renderFrame(currentFrame)}}else renderer.render(scene,camera)})}
    window.renderFrame(0);window.rendererReady=true;
