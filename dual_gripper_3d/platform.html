<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OSMO Motion Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071018;color:#edf5fb;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}body{background:radial-gradient(circle at 18% 8%,#123246 0,transparent 34%),radial-gradient(circle at 85% 24%,#183329 0,transparent 30%),#071018}.shell{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:42px 0 70px}.eyebrow{color:#50d3f2;font-size:12px;font-weight:800;letter-spacing:.22em}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:10px 0 30px}.hero h1{margin:0;font-size:clamp(34px,5vw,62px);line-height:1;letter-spacing:-.04em}.hero p{max-width:520px;margin:0;color:#99aabb;line-height:1.7}.panel{background:rgba(11,22,32,.88);border:1px solid #263d4e;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.32);backdrop-filter:blur(18px)}.upload-panel{padding:26px}.name-row{display:grid;grid-template-columns:1fr auto;gap:14px;margin-bottom:18px}.name-row input{width:100%;height:46px;padding:0 15px;border:1px solid #31495b;border-radius:10px;background:#0a1823;color:#fff;font-size:15px;outline:none}.name-row input:focus{border-color:#50d3f2}.badge{display:flex;align-items:center;padding:0 14px;border:1px solid #315342;border-radius:10px;color:#7bd957;background:#102219;font-size:12px;font-weight:800;letter-spacing:.06em}.drops{display:grid;grid-template-columns:1fr 1fr;gap:16px}.drop{position:relative;min-height:176px;padding:24px;border:1px dashed #426175;border-radius:14px;background:#091823;cursor:pointer;transition:.18s ease}.drop:hover,.drop.drag{border-color:#50d3f2;background:#0d2130;transform:translateY(-2px)}.drop.ready{border-style:solid;border-color:#60ce88;background:#0c211a}.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.drop .index{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#17394d;color:#50d3f2;font-weight:900}.drop h3{margin:18px 0 6px;font-size:17px}.drop p{margin:0;color:#7f93a4;font-size:13px;line-height:1.6}.drop .file{margin-top:12px;color:#7bd957;font:700 12px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:16px;margin-top:20px}.primary{height:48px;padding:0 24px;border:0;border-radius:11px;background:#50d3f2;color:#041017;font-size:15px;font-weight:900;cursor:pointer}.primary:disabled{cursor:not-allowed;opacity:.42}.status{flex:1;color:#94a6b5;font-size:13px}.progress{height:6px;margin-top:16px;overflow:hidden;border-radius:999px;background:#1d2d38}.progress div{width:0;height:100%;background:linear-gradient(90deg,#50d3f2,#7bd957);transition:width .12s linear}.error{display:none;margin-top:14px;padding:11px 13px;border:1px solid #743c42;border-radius:9px;background:#271418;color:#ff9ea8;font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:34px 4px 14px}.section-head h2{margin:0;font-size:20px}.ghost{border:1px solid #31495b;border-radius:8px;background:#0b1924;color:#b8c7d3;padding:8px 12px;cursor:pointer}.projects{display:grid;gap:10px}.project{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:17px 19px}.project h3{margin:0 0 6px;font-size:15px}.project .meta{color:#7f93a4;font-size:12px}.project .state{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:999px;background:#173126;color:#79dc98;font-weight:800}.project .state.failed{background:#351a20;color:#ff909b}.open{display:inline-grid;place-items:center;height:36px;padding:0 14px;border-radius:8px;background:#17394d;color:#69ddf6;text-decoration:none;font-weight:800;font-size:13px}.empty{padding:28px;text-align:center;color:#728697}.foot{margin-top:18px;color:#637786;font-size:11px;line-height:1.6}@media(max-width:760px){.shell{width:min(100% - 24px,1180px);padding-top:24px}.hero{display:block}.hero p{margin-top:16px}.drops{grid-template-columns:1fr}.name-row{grid-template-columns:1fr}.badge{height:40px}.project{grid-template-columns:1fr}.open{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">OSMO · SINGLE GRIPPER VISUALIZATION</div>
    <div class="hero"><h1>Motion Studio</h1><p>上传处理完成的时间线和前镜头视频。校验通过后立即生成可旋转、缩放、拖动时间轴的 3D 动画。</p></div>
    <section class="panel upload-panel">
      <div class="name-row"><input id="name" maxlength="80" placeholder="动画名称，例如：0064 单夹爪测试"><div class="badge">V52 GRIPPER · TAG_MAP</div></div>
      <div class="drops">
        <label class="drop" id="timeline-drop"><input id="timeline" type="file" accept="application/json,.json"><span class="index">1</span><h3>时间线数据</h3><p>选择 WebGL timeline JSON，平台会校验帧、位姿、时间和 FPS。</p><div class="file" id="timeline-name">选择 timeline.json</div></label>
        <label class="drop" id="video-drop"><input id="video" type="file" accept="video/mp4,.mp4"><span class="index">2</span><h3>前镜头视频</h3><p>选择与时间线同步的 MP4。浏览器播放时由视频时钟驱动 3D。</p><div class="file" id="video-name">选择 front-video.mp4</div></label>
      </div>
      <div class="actions"><button class="primary" id="generate" disabled>生成交互动画</button><div class="status" id="status">等待选择两个文件</div></div>
      <div class="progress"><div id="progress"></div></div><div class="error" id="error"></div>
    </section>
    <div class="section-head"><h2>已生成动画</h2><button class="ghost" id="refresh">刷新</button></div>
    <div class="projects" id="projects"><div class="panel empty">正在读取项目…</div></div>
    <div class="foot">当前版本使用服务器固定的 v52 夹爪模型与单夹爪场景。相对力是垫片形变强度，不是牛顿标定值。</div>
  </main>
  <script>
    const timelineInput=document.getElementById('timeline'),videoInput=document.getElementById('video'),generate=document.getElementById('generate'),statusText=document.getElementById('status'),progress=document.getElementById('progress'),errorBox=document.getElementById('error');
    const formatBytes=value=>value<1024*1024?`${(value/1024).toFixed(0)} KB`:`${(value/1024/1024).toFixed(1)} MB`;
    function updateSelection(input,drop,name){const file=input.files[0];drop.classList.toggle('ready',!!file);name.textContent=file?`${file.name} · ${formatBytes(file.size)}`:name.dataset.placeholder;generate.disabled=!(timelineInput.files[0]&&videoInput.files[0])}
    const timelineDrop=document.getElementById('timeline-drop'),videoDrop=document.getElementById('video-drop'),timelineName=document.getElementById('timeline-name'),videoName=document.getElementById('video-name');
    timelineName.dataset.placeholder=timelineName.textContent;videoName.dataset.placeholder=videoName.textContent;
    timelineInput.onchange=()=>updateSelection(timelineInput,timelineDrop,timelineName);videoInput.onchange=()=>updateSelection(videoInput,videoDrop,videoName);
    for(const drop of [timelineDrop,videoDrop]){drop.addEventListener('dragover',event=>{event.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',()=>drop.classList.remove('drag'))}
    const request=async(url,options={})=>{const response=await fetch(url,options),body=await response.json();if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);return body};
    function upload(url,file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',url);xhr.upload.onprogress=event=>{if(event.lengthComputable)onProgress(event.loaded/event.total)};xhr.onload=()=>{let body={};try{body=JSON.parse(xhr.responseText)}catch{}xhr.status>=200&&xhr.status<300?resolve(body):reject(new Error(body.error||`HTTP ${xhr.status}`))};xhr.onerror=()=>reject(new Error('上传连接中断'));xhr.send(file)})}
    async function loadProjects(){
      try{const {projects}=await request('/api/projects');const root=document.getElementById('projects');if(!projects.length){root.innerHTML='<div class="panel empty">还没有动画。上传第一组数据即可生成。</div>';return}root.innerHTML=projects.map(project=>{const summary=project.summary?`${project.summary.frames} 帧 · ${Number(project.summary.fps).toFixed(0)} FPS · ${Number(project.summary.duration_s).toFixed(2)} 秒`:'等待文件';const state=project.status==='ready'?'已就绪':project.status==='failed'?'失败':'上传中';return `<article class="panel project"><div><h3>${escapeHtml(project.name)} <span class="state ${project.status}">${state}</span></h3><div class="meta">${escapeHtml(summary)} · ${new Date(project.created_at).toLocaleString()}</div></div>${project.status==='ready'?`<a class="open" href="/view/${project.id}/?interactive=1">打开动画</a>`:''}</article>`}).join('')}catch(error){document.getElementById('projects').innerHTML=`<div class="panel empty">读取失败：${escapeHtml(error.message)}</div>`}}
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    generate.onclick=async()=>{
      generate.disabled=true;errorBox.style.display='none';progress.style.width='0%';
      try{
        const timeline=timelineInput.files[0],video=videoInput.files[0],name=document.getElementById('name').value.trim()||timeline.name.replace(/\.json$/i,'');
        statusText.textContent='创建动画项目…';const created=await request('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const id=created.project.id;
        statusText.textContent='上传时间线…';await upload(`/api/projects/${id}/timeline`,timeline,value=>progress.style.width=`${value*15}%`);
        statusText.textContent='上传前镜头视频…';await upload(`/api/projects/${id}/video`,video,value=>progress.style.width=`${15+value*80}%`);
        statusText.textContent='校验并生成动画…';const result=await request(`/api/projects/${id}/publish`,{method:'POST'});progress.style.width='100%';statusText.textContent='生成完成，正在打开动画…';location.href=result.project.view_url
      }catch(error){errorBox.textContent=error.message;errorBox.style.display='block';statusText.textContent='生成失败';generate.disabled=false}
    };
    document.getElementById('refresh').onclick=loadProjects;loadProjects();
  </script>
</body>
</html>
