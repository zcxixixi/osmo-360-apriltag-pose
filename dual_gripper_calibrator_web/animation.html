<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>双夹爪 6DoF 交互动画</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#070b10;color:#edf3f8}#viewport{position:fixed;inset:0}.top{position:fixed;left:24px;top:20px;pointer-events:none}.top h1{margin:0;font-size:22px;letter-spacing:.04em}.top p{margin:7px 0 0;color:#91a0b2;font-size:12px}.legend{display:flex;gap:18px;margin-top:13px;font-size:12px}.dot{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%}.left{background:#37c8ff}.right{background:#58df91}.panel{position:fixed;left:24px;right:24px;bottom:20px;padding:14px 16px;border:1px solid #2c3948;border-radius:12px;background:rgba(11,16,23,.92);backdrop-filter:blur(10px)}.row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center}button,select{height:36px;border:1px solid #38485c;border-radius:8px;background:#182230;color:#edf3f8;padding:0 13px;cursor:pointer}button:hover{border-color:#62baff}button.primary{min-width:76px;background:#2d92c1;border-color:#43bfe9}input[type=range]{width:100%;accent-color:#54cfff}.time{min-width:112px;text-align:right;font-variant-numeric:tabular-nums}.metrics{display:flex;gap:26px;margin-top:12px;color:#92a1b3;font-size:12px}.metrics b{margin-left:6px;color:#f5f7fa;font-weight:500}.hint{position:fixed;right:24px;top:22px;padding:9px 12px;border:1px solid #2c3948;border-radius:8px;background:rgba(11,16,23,.82);color:#9babbc;font-size:12px}.warning{color:#f0c65a}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#070b10;color:#9eafc1;z-index:10}.loading.hidden{display:none}@media(max-width:760px){.row{grid-template-columns:auto 1fr auto}.row select,.row #reset{display:none}.metrics{gap:12px;flex-wrap:wrap}.hint{display:none}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="loading" class="loading">正在载入真实 6DoF 时间线与夹爪模型…</div>
  <div id="viewport"></div>
  <header class="top"><h1>双夹爪 6DoF 交互动画</h1><p>中心原点 · 三连击裁切 · 真实运动增量</p><div class="legend"><span><i class="dot left"></i>左夹爪</span><span><i class="dot right"></i>右夹爪</span><span class="warning">手动初始布局，不作为动捕真值</span></div></header>
  <div class="hint">左键旋转 · 右键平移 · 滚轮缩放</div>
  <section class="panel">
    <div class="row"><button id="play" class="primary">暂停</button><input id="timeline" type="range" min="0" max="1" step="1" value="0" aria-label="动画时间轴"><span id="time" class="time">0.00 / 0.00 s</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="reset">重置视角</button></div>
    <div class="metrics"><span>左开合角<b id="leftAngle">—</b></span><span>右开合角<b id="rightAngle">—</b></span><span>基座距离<b id="distance">—</b></span><span>左位姿<b id="leftState">—</b></span><span>右位姿<b id="rightState">—</b></span></div>
  </section>
  <script type="module">
    import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLLoader}from'three/addons/loaders/STLLoader.js';
    const timeline=await(await fetch('/api/animation-timeline')).json(),frames=timeline.frames,host=document.getElementById('viewport');
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b10);scene.fog=new THREE.Fog(0x070b10,1.8,4.2);const camera=new THREE.PerspectiveCamera(42,1,.01,20);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;scene.add(new THREE.HemisphereLight(0xcde7ff,0x202934,2.2));const key=new THREE.DirectionalLight(0xffffff,3.4);key.position.set(.7,-.5,1.2);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x4d86ff,1.6);rim.position.set(-1,.7,.4);scene.add(rim);
    const grid=new THREE.GridHelper(2.4,48,0x53657a,0x1b2632);grid.rotation.x=Math.PI/2;grid.position.z=-.12;scene.add(grid);scene.add(new THREE.AxesHelper(.20));
    const loader=new STLLoader(),geometries={};await Promise.all(['base_link.STL','Link1.STL','Link2.STL','Link3.STL'].map(async name=>{geometries[name]=await loader.loadAsync('/mesh/'+name);geometries[name].computeVertexNormals()}));const material=(color,metal=.16)=>new THREE.MeshStandardMaterial({color,roughness:.43,metalness:metal,side:THREE.DoubleSide});const makeMesh=(name,mat)=>{const m=new THREE.Mesh(geometries[name],mat);m.castShadow=true;m.receiveShadow=true;return m};
    function buildGripper(baseColor){const root=new THREE.Group();root.add(makeMesh('base_link.STL',material(baseColor,.34)));const fixed=new THREE.Group();fixed.position.set(.02625,0,.0196);fixed.add(makeMesh('Link3.STL',material(0xb7c2d0,.25)));root.add(fixed);const j1=new THREE.Group();j1.position.set(.015,.01425,.0151);j1.add(makeMesh('Link1.STL',material(0x5de29a)));root.add(j1);const j2=new THREE.Group();j2.position.set(.015,-.01425,.0157);j2.add(makeMesh('Link2.STL',material(0xf1c84f)));root.add(j2);root.userData={j1,j2};root.add(new THREE.AxesHelper(.10));return root}
    const left=buildGripper(0x2fbde9),right=buildGripper(0x43cb80);scene.add(left,right);function makeTrail(color){const geometry=new THREE.BufferGeometry(),values=new Float32Array(frames.length*3);geometry.setAttribute('position',new THREE.BufferAttribute(values,3));geometry.setDrawRange(0,1);const line=new THREE.Line(geometry,new THREE.LineBasicMaterial({color}));scene.add(line);return line}const leftTrail=makeTrail(0x37c8ff),rightTrail=makeTrail(0x58df91);frames.forEach((frame,index)=>{leftTrail.geometry.attributes.position.array.set(frame.left.p,index*3);rightTrail.geometry.attributes.position.array.set(frame.right.p,index*3)});leftTrail.geometry.attributes.position.needsUpdate=true;rightTrail.geometry.attributes.position.needsUpdate=true;const connectorGeometry=new THREE.BufferGeometry(),connector=new THREE.Line(connectorGeometry,new THREE.LineBasicMaterial({color:0xf1c84f,transparent:true,opacity:.8}));scene.add(connector);
    const all=frames.flatMap(frame=>[new THREE.Vector3(...frame.left.p),new THREE.Vector3(...frame.right.p)]),box=new THREE.Box3().setFromPoints(all);box.expandByScalar(.12);const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z,.55);function resetView(){camera.position.copy(center).add(new THREE.Vector3(radius*.95,-radius*1.2,radius*.8));orbit.target.copy(center);orbit.update()}resetView();
    function apply(root,data){root.position.fromArray(data.p);root.quaternion.fromArray(data.q);root.userData.j1.rotation.z=THREE.MathUtils.degToRad(data.joints[0]);root.userData.j2.rotation.z=THREE.MathUtils.degToRad(data.joints[1])}const slider=document.getElementById('timeline'),play=document.getElementById('play');slider.max=frames.length-1;let playhead=0,playing=true,speed=1,last=performance.now();
    function show(index){const displayIndex=Math.max(0,Math.min(frames.length-1,index|0)),frame=frames[displayIndex];apply(left,frame.left);apply(right,frame.right);leftTrail.geometry.setDrawRange(0,displayIndex+1);rightTrail.geometry.setDrawRange(0,displayIndex+1);connectorGeometry.setFromPoints([left.position,right.position]);slider.value=displayIndex;document.getElementById('time').textContent=frame.t.toFixed(2)+' / '+timeline.duration_s.toFixed(2)+' s';document.getElementById('leftAngle').textContent=frame.left.opening.toFixed(1)+'° · '+frame.left.angle_state;document.getElementById('rightAngle').textContent=frame.right.opening.toFixed(1)+'° · '+frame.right.angle_state;document.getElementById('distance').textContent=(left.position.distanceTo(right.position)*1000).toFixed(1)+' mm';document.getElementById('leftState').textContent=frame.left.pose_state;document.getElementById('rightState').textContent=frame.right.pose_state}
    play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';last=performance.now()};slider.oninput=()=>{playing=false;play.textContent='播放';playhead=+slider.value;show(playhead)};document.getElementById('speed').onchange=e=>{speed=+e.target.value};document.getElementById('reset').onclick=resetView;addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();play.click()}if(event.key==='r')resetView()});function resize(){const width=innerWidth,height=innerHeight;camera.aspect=width/height;camera.updateProjectionMatrix();renderer.setSize(width,height,false)}addEventListener('resize',resize);resize();show(0);document.getElementById('loading').classList.add('hidden');
    function tick(){const now=performance.now(),delta=Math.min((now-last)/1000,.25);last=now;if(playing){playhead+=delta*timeline.fps*speed;if(playhead>=frames.length)playhead%=frames.length;show(Math.floor(playhead))}orbit.update();renderer.render(scene,camera)}tick();setInterval(tick,1000/60);
  </script>
</body>
</html>
