[project]
name = "osmo-apriltag-demo"
version = "0.1.0"
description = "Offline Osmo 360 panorama AprilGrid pose processor with legacy RTMP demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "flask>=3.1.3",
  "matplotlib>=3.11.1",
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.10,<5",
  "py360convert>=1.0.4,<2",
  "scipy>=1.13,<2",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
gpu = ["cupy-cuda13x[ctk]>=14.2,<15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
