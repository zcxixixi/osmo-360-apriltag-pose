[project]
name = "osmo-apriltag-demo"
version = "0.1.0"
description = "Offline Osmo 360 panorama AprilGrid pose processor with legacy RTMP demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "flask>=3.1.3",
  "h5py>=3.11,<4",
  "matplotlib>=3.11.1",
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.10,<5",
  "py360convert>=1.0.4,<2",
  "python-fcl>=0.7,<0.8",
  "rtree>=1.4,<2",
  "scipy>=1.13,<2",
  "trimesh>=5,<6",
  "zarr>=2.18,<3",
]

[project.scripts]
umi = "osmo360.pipeline.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
gpu = ["cupy-cuda13x[ctk]>=14.2,<15"]
node-gpu = [
  "av>=18.1,<19",
  "cupy-cuda13x[ctk]>=14.2,<15",
  "PyNvVideoCodec==2.2.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "-p", "no:launch_testing",
  "-p", "no:launch_ros",
  "-p", "no:ament_lint",
  "-p", "no:ament_xmllint",
  "-p", "no:ament_flake8",
  "-p", "no:ament_pep257",
  "-p", "no:ament_copyright",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
